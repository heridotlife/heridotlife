allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - astro-eslint-parser@2.0.0
  - eslint-plugin-astro@2.0.0
  - '@cloudflare/workers-types@4.20260629.1'
  - lucide-react@1.22.0
onlyBuiltDependencies:
  - sharp
  - workerd
  - esbuild
peerDependencyRules:
  allowedVersions:
    # vitest 4 / @vitest/mocker / @tailwindcss/vite peer-declare vite ^7, but the
    # project runs vite 8 (the full unit/integration/e2e suite passes). Accept it.
    vite: '8'
overrides:
  yaml: '2.8.4'
  # Security overrides — force patched versions of vulnerable transitive deps.
  # All are build/dev-only (jsdom, astro, @astrojs/cloudflare). See Dependabot alerts.
  js-yaml: '^4.2.0' # GHSA-h67p-54hq-rp68
  undici: '^7.28.0' # GHSA-hm92-r4w5-c3mj, GHSA-vmh5-mc38-953g, GHSA-p88m-4jfj-68fv, GHSA-pr7r-676h-xcf6, GHSA-35p6-xmwp-9g52, GHSA-g8m3-5g58-fq7m
  esbuild: '^0.28.1' # GHSA-g7r4-m6w7-qqqr
  '@babel/core': '^7.29.6' # GHSA-4x5r-pxfx-6jf8
  vite@7: '^7.3.5' # GHSA-fx2h-pf6j-xcff, GHSA-v6wh-96g9-6wx3 (only the 7.x line; top-level vite 8 untouched)
