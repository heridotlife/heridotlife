version: 2
updates:
  # Enable version updates for Bun dependencies (package.json + bun.lock).
  # NOTE: Dependabot's Bun ecosystem performs VERSION updates only — it does not
  # support security updates (see GitHub's supported-ecosystems docs). Using the
  # 'bun' ecosystem (not 'npm') is required so Dependabot regenerates bun.lock;
  # the 'npm' ecosystem leaves bun.lock stale and breaks --frozen-lockfile CI.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '09:00'
    open-pull-requests-limit: 15
    # Allow updates for all dependency types
    allow:
      - dependency-type: 'all'
    groups:
      # Group Astro and related packages
      astro:
        patterns:
          - 'astro*'
          - '@astrojs/*'
        update-types:
          - 'minor'
          - 'patch'
      # Group dev dependencies
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      # Group production dependencies (minor and patch)
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependencies'
      - 'automated'
    # Request review from the maintainer on dependency PRs
    reviewers:
      - 'heridotlife'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'automated'
    commit-message:
      prefix: 'ci'
      include: 'scope'
