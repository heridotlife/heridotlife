name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    when:
      labels:
        - 'feature'
        - 'feat'
  - title: '🐛 Bug Fixes'
    when:
      labels:
        - 'fix'
        - 'bug'
  - title: '🧰 Maintenance'
    when:
      labels:
        - 'chore'
        - 'refactor'
        - 'style'
        - 'test'
  - title: '📚 Documentation'
    when:
      labels:
        - 'docs'
        - 'documentation'
  # Version resolver (replaces the deprecated top-level `version-resolver` block).
  # The final condition-less entry reproduces the old `default: patch` behavior.
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      labels:
        - 'major'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      labels:
        - 'minor'
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      labels:
        - 'patch'
        - 'bug'
        - 'fix'
  - type: 'version-resolver'
    semver-increment: 'patch'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  ## What's Changed
  $CHANGES
