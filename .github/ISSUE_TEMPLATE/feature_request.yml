---
name: Feature Request
description: Suggest an idea or improvement
title: '[FEATURE] '
labels: ['enhancement']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Note that this is a personal project, so ideas
        may be declined if they don't fit its direction — but they're always
        welcome to discuss.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem would this solve? Why is it useful?
      placeholder: "I'm frustrated when... / It would be great if..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've thought about.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Mockups, links, or any other context.
    validations:
      required: false
