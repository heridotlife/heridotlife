name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm eslint .

      - name: Run Prettier check
        run: pnpm prettier --check .

      - name: Run type check
        run: pnpm type-check

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run tests with coverage
        run: pnpm test:coverage
        continue-on-error: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  integration:
    name: Integration (real D1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs the data layer against a real D1 (miniflare/workerd) — no Astro
      # build required, so this is safe in CI (unlike e2e, which needs the
      # built worker and runs against the Cloudflare preview instead).
      - name: Run integration tests
        run: pnpm test:integration

  e2e-local:
    name: E2E (local boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Per-PR e2e feedback on main & develop without waiting for a preview
      # deploy: scripts/e2e-local.mjs builds the worker, boots it with
      # `wrangler dev`, runs the read-only HTTP smoke, and tears it down.
      # `pnpm build` goes through build-wrapper.mjs, which tolerates the
      # Cloudflare adapter's post-build ESM-loader warning (the dist output is
      # already written), so the build succeeds in CI.
      - name: Build, boot worker, and run e2e smoke
        run: pnpm test:e2e:local

  # NOTE: there is no standalone build job — the e2e-local job above exercises
  # the build. A separate post-deploy e2e smoke runs against the Cloudflare
  # preview in .github/workflows/e2e.yml (on: deployment_status).
