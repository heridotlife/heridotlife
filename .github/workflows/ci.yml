name: CI

on:
  # `push` only on main. develop is validated via pull_request (feature → develop
  # PRs and the auto develop → main release PR), so pushing to develop would
  # otherwise run twice: once for `push` and once for that PR's `synchronize`.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Node is still required: `bun run` drives the scripts, but Astro
      # (build/check) and Vitest execute under Node via their bin shebangs.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bunx eslint .

      - name: Run Prettier check
        run: bunx prettier --check .

      - name: Run type check
        run: bun run type-check

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Node is still required: `bun run` drives the scripts, but Astro
      # (build/check) and Vitest execute under Node via their bin shebangs.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

      # Gating: the coverage thresholds in vitest.config.ts (85% lines/functions/
      # statements, 80% branches) fail this step — and the job — if regressed.
      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  integration:
    name: Integration (real D1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Node is still required: `bun run` drives the scripts, but Astro
      # (build/check) and Vitest execute under Node via their bin shebangs.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs the data layer against a real D1 (miniflare/workerd) — no Astro
      # build required, so this is safe in CI (unlike e2e, which needs the
      # built worker and runs against the Cloudflare preview instead).
      - name: Run integration tests
        run: bun run test:integration

  e2e-local:
    name: E2E (local boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Node is still required: `bun run` drives the scripts, but Astro
      # (build/check) and Vitest execute under Node via their bin shebangs.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Per-PR e2e feedback on main & develop without waiting for a preview
      # deploy: scripts/e2e-local.mjs builds the worker, boots it with
      # `wrangler dev`, runs the read-only HTTP smoke, and tears it down.
      # `bun run build` goes through build-wrapper.mjs, which tolerates the
      # Cloudflare adapter's post-build ESM-loader warning (the dist output is
      # already written), so the build succeeds in CI.
      - name: Build, boot worker, and run e2e smoke
        run: bun run test:e2e:local

  # NOTE: there is no standalone build job — the e2e-local job above exercises
  # the build. A separate post-deploy e2e smoke runs against the Cloudflare
  # preview in .github/workflows/e2e.yml (on: deployment_status).
