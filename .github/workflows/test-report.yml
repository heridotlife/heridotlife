name: Test Report

on:
  # `push` only on main — develop is covered by pull_request (feature → develop
  # PRs and the auto develop → main release PR), avoiding duplicate push +
  # pull_request runs on every develop push.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test-report:
    name: Test Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Node is still required: `bun run` drives the scripts, but Astro
      # (build/check) and Vitest execute under Node via their bin shebangs.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage
        continue-on-error: true

      - name: Test Report Summary
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Vitest Tests
          path: 'coverage/junit.xml'
          reporter: 'java-junit'
          fail-on-error: false

      # Coverage is reported on PRs by the maintained MishaKav action below.
      # The previous romeovs/lcov-reporter-action step was removed: it was the
      # latest available (v0.4.0, unmaintained) yet still on the deprecated
      # Node.js 20 runtime, and produced a duplicate coverage comment.
      - name: Coverage Summary Comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@v1.0.34
        with:
          coverage-path: ./coverage/coverage-summary.json
          junitxml-path: ./coverage/junit.xml
          title: Test Coverage Report
          badge-title: Coverage
          hide-comment: false
          create-new-comment: false
          hide-summary: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            coverage/
            tests/results/
          retention-days: 30

      - name: Check coverage thresholds
        if: github.event_name == 'pull_request'
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          bun run test:coverage --reporter=verbose 2>&1 | grep -A 20 "Coverage report" >> $GITHUB_STEP_SUMMARY || true
