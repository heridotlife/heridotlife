name: 'CodeQL Security Analysis'

on:
  # `push` only on main — develop is covered by pull_request (feature → develop
  # PRs and the auto develop → main release PR), avoiding duplicate push +
  # pull_request runs on every develop push.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run at 02:00 every Monday
    - cron: '0 2 * * 1'

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Node is still required: `bun run` drives the scripts, but Astro
      # (build/check) and Vitest execute under Node via their bin shebangs.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{matrix.language}}'
